
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon — SNS Fragrance</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Montserrat', sans-serif;
    background: #080808;
    color: #fff;
    overflow: hidden;
}

.coming-soon {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
        linear-gradient(rgba(0,0,0,.58), rgba(0,0,0,.68)),
        url('YOUR-BACKGROUND-IMAGE.jpg') center/cover no-repeat;
}

/* Soft cinematic effect */
.coming-soon::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.12);
    backdrop-filter: blur(2px);
}

/* Center vertical line */
.center-line {
    position: absolute;
    top: 8%;
    bottom: 8%;
    left: 50%;
    width: 1px;
    background: linear-gradient(
        to bottom,
        transparent,
        #7A5C2C 15%,
        #7A5C2C 85%,
        transparent
    );
    opacity: .8;
}

/* Main content */
.content {
    position: relative;
    z-index: 2;
    text-align: center;
    width: 90%;
    max-width: 500px;
}

.eyebrow {
    font-size: 8px;
    font-weight: 400;
    letter-spacing: 2px;
    margin-bottom: 18px;
    text-transform: uppercase;
}

.main-title {
    font-size: clamp(34px, 6vw, 58px);
    font-weight: 300;
    line-height: 1.05;
    letter-spacing: 5px;
    text-transform: uppercase;
}

.bottom-text {
    margin-top: 23px;
    font-size: 7px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* Decorative radial lines */
.rays {
    position: absolute;
    inset: -35px;
    pointer-events: none;
}

.rays span {
    position: absolute;
    width: 1px;
    height: 13px;
    background: rgba(255,255,255,.75);
}

.rays span:nth-child(1) {
    top: 0;
    left: 50%;
}

.rays span:nth-child(2) {
    bottom: 0;
    left: 50%;
}

.rays span:nth-child(3) {
    left: 0;
    top: 50%;
    transform: rotate(90deg);
}

.rays span:nth-child(4) {
    right: 0;
    top: 50%;
    transform: rotate(90deg);
}

.rays span:nth-child(5) {
    top: 15%;
    left: 15%;
    transform: rotate(-35deg);
}

.rays span:nth-child(6) {
    top: 15%;
    right: 15%;
    transform: rotate(35deg);
}

.rays span:nth-child(7) {
    bottom: 15%;
    left: 15%;
    transform: rotate(35deg);
}

.rays span:nth-child(8) {
    bottom: 15%;
    right: 15%;
    transform: rotate(-35deg);
}

/* Mobile */
@media (max-width: 600px) {
    .main-title {
        font-size: 36px;
        letter-spacing: 4px;
    }

    .center-line {
        top: 12%;
        bottom: 12%;
    }
}
</style>
</head>

<body>

<section class="coming-soon">

    <div class="center-line"></div>

    <div class="content">

        <div class="rays">
            <span></span><span></span>
            <span></span><span></span>
            <span></span><span></span>
            <span></span><span></span>
        </div>

        <p class="eyebrow">SPECIAL COLLABORATION IS</p>

        <h1 class="main-title">
            Coming<br> Soon
        </h1>

        <p class="bottom-text">Stay Tuned</p>

    </div>

</section>

</body>
</html>
