<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — SNS Fragrance</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }

    /* =====================================================
       HOMEPAGE BACKGROUND
       ===================================================== */

    .page-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 1;
      background: #fff;
    }

    /* Dark overlay over the homepage, like your screenshot */
    .page-dim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.36);
      z-index: 2;
      pointer-events: none;
    }

    /* =====================================================
       CART PANEL
       ===================================================== */

    .cart-panel {
      position: fixed;
      top: 0;
      right: 0;

      width: 380px;
      max-width: 100vw;
      height: 100vh;

      background: #fff;
      z-index: 10;

      display: flex;
      flex-direction: column;

      box-shadow: -8px 0 30px rgba(0, 0, 0, 0.08);
    }

    /* =====================================================
       CART HEADER
       ===================================================== */

    .cart-header {
      height: 39px;
      min-height: 39px;

      padding: 0 14px 0 17px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #e6e6e6;
    }

    .cart-title {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2px;
      color: #111;
    }

    .cart-close {
      width: 25px;
      height: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      background: transparent;
      cursor: pointer;

      padding: 0;
    }

    .cart-close svg {
      width: 20px;
      height: 20px;

      fill: none;
      stroke: #111;
      stroke-width: 1.7;
      stroke-linecap: round;
    }

    /* =====================================================
       CART CONTENT
       ===================================================== */

    .cart-content {
      flex: 1;
      overflow-y: auto;
      padding: 22px 16px 25px;
    }

    /* EMPTY CART */

    .empty-cart {
      min-height: calc(100vh - 64px);

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .empty-message {
      margin-top: 162px;
      margin-bottom: 29px;

      font-size: 13px;
      font-weight: 400;
      color: #111;
      text-align: center;
    }

    .category-links {
      width: 100%;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 15px;
    }

    .category-link {
      min-height: 60px;

      border: 1px solid #111;
      border-radius: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 13px;

      color: #111;
      background: #fff;
      text-decoration: none;

      font-size: 13px;
      font-weight: 400;
      line-height: 1.25;
      text-align: center;

      transition: 0.2s ease;
    }

    .category-link:hover {
      background: #111;
      color: #fff;
    }

    .category-link.full {
      grid-column: 1 / -1;
    }

    /* =====================================================
       CART ITEMS
       ===================================================== */

    .cart-items {
      display: none;
    }

    .cart-items.has-items {
      display: block;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 14px;

      padding: 15px 0;

      border-bottom: 1px solid #e8e8e8;
    }

    .cart-item-image {
      width: 82px;
      height: 100px;

      background: #f7f5f0;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .cart-item-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .cart-item-info {
      min-width: 0;
      position: relative;
      padding-right: 22px;
    }

    .cart-item-name {
      font-family: Georgia, serif;
      font-size: 17px;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .cart-item-category {
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 8px;
    }

    .cart-item-price {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .remove-item {
      position: absolute;
      top: 0;
      right: 0;

      width: 22px;
      height: 22px;

      border: 0;
      background: transparent;
      cursor: pointer;

      font-size: 19px;
      line-height: 1;
      color: #555;
    }

    .quantity-control {
      display: inline-flex;
      align-items: center;

      height: 31px;

      border: 1px solid #111;
      border-radius: 18px;
    }

    .quantity-control button {
      width: 29px;
      height: 29px;

      border: 0;
      background: transparent;

      cursor: pointer;
      font-size: 15px;
    }

    .quantity-value {
      min-width: 25px;
      text-align: center;
      font-size: 12px;
    }

    /* =====================================================
       CART SUMMARY
       ===================================================== */

    .cart-summary {
      display: none;

      margin-top: 22px;
      padding-top: 18px;

      border-top: 1px solid #111;
    }

    .cart-items.has-items + .cart-summary {
      display: block;
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 12px;

      font-size: 13px;
    }

    .summary-row.total {
      margin-top: 16px;
      padding-top: 16px;

      border-top: 1px solid #e5e5e5;

      font-size: 15px;
      font-weight: 600;
    }

    .checkout-button {
      width: 100%;
      height: 48px;

      margin-top: 18px;

      border: 1px solid #111;
      background: #111;
      color: #fff;

      cursor: pointer;

      font-size: 13px;
      letter-spacing: 0.4px;

      transition: 0.2s ease;
    }

    .checkout-button:hover {
      background: #fff;
      color: #111;
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 600px) {
      .cart-panel {
        width: 100vw;
      }

      .empty-message {
        margin-top: 140px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       HOMEPAGE BEHIND CART
       ===================================================== -->

  <iframe
    class="page-background"
    id="homeFrame"
    src="index.html"
    title="SNS Fragrance Homepage">
  </iframe>

  <div class="page-dim"></div>


  <!-- =====================================================
       CART PANEL
       ===================================================== -->

  <aside class="cart-panel">

    <!-- HEADER -->

    <div class="cart-header">

      <div class="cart-title">
        CART (<span id="cartCount">0</span>)
      </div>

      <button
        class="cart-close"
        type="button"
        aria-label="Close Cart"
        onclick="goBack()">

        <svg viewBox="0 0 24 24">
          <path d="M5 5L19 19"></path>
          <path d="M19 5L5 19"></path>
        </svg>

      </button>

    </div>


    <!-- CONTENT -->

    <div class="cart-content">

      <!-- EMPTY CART -->

      <div
        class="empty-cart"
        id="emptyCart">

        <div class="empty-message">
          Your Cart is Empty
        </div>

        <div class="category-links">

          <a
            href="newarrivals.html"
            class="category-link">
            NEW ARRIVAL
          </a>

          <a
            href="edp.html"
            class="category-link">
            EXTRAIT DE<br>PARFUM
          </a>

          <a
            href="cloudmist.html"
            class="category-link">
            CLOUD MIST
          </a>

          <a
            href="bodycare.html"
            class="category-link">
            BODY CARE
          </a>

          <a
            href="bestsellers.html"
            class="category-link full">
            EVERYONE'S FAVORITE
          </a>

        </div>

      </div>


      <!-- CART ITEMS -->

      <div
        class="cart-items"
        id="cartItems">
      </div>


      <!-- SUMMARY -->

      <div
        class="cart-summary"
        id="cartSummary">

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">Rp 0</span>
        </div>

        <div class="summary-row">
          <span>Shipping</span>
          <span>Calculated at checkout</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span id="total">Rp 0</span>
        </div>

        <button
          class="checkout-button"
          type="button"
          onclick="checkout()">
          CHECKOUT
        </button>

      </div>

    </div>

  </aside>


  <script>
    /* =====================================================
       CART DATA
       ===================================================== */

    const STORAGE_KEY = "snsCart";

    let cart = [];


    /* =====================================================
       LOAD CART
       ===================================================== */

    function loadCart() {

      try {

        const savedCart =
          localStorage.getItem(STORAGE_KEY);

        if (savedCart) {

          cart = JSON.parse(savedCart);

        }

      } catch (error) {

        cart = [];

      }

      normalizeCart();

      renderCart();
    }


    /* =====================================================
       NORMALIZE CART
       ===================================================== */

    function normalizeCart() {

      cart = cart.map(item => {

        if (typeof item === "string") {

          return {
            name: item,
            price: 299000,
            quantity: 1,
            category: "Extrait de Parfum",
            image: ""
          };

        }

        return {
          name: item.name || "SNS Fragrance",
          price: Number(item.price) || 299000,
          quantity: Number(item.quantity) || 1,
          category: item.category || "Extrait de Parfum",
          image: item.image || ""
        };

      });

    }


    /* =====================================================
       SAVE CART
       ===================================================== */

    function saveCart() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(cart)
      );

    }


    /* =====================================================
       RENDER CART
       ===================================================== */

    function renderCart() {

      const cartItems =
        document.getElementById("cartItems");

      const emptyCart =
        document.getElementById("emptyCart");

      const cartCount =
        document.getElementById("cartCount");

      const subtotalElement =
        document.getElementById("subtotal");

      const totalElement =
        document.getElementById("total");


      const totalQuantity =
        cart.reduce(
          (sum, item) =>
            sum + Number(item.quantity || 0),
          0
        );


      cartCount.textContent =
        totalQuantity;


      /* EMPTY */

      if (cart.length === 0) {

        emptyCart.style.display = "flex";

        cartItems.classList.remove("has-items");

        cartItems.innerHTML = "";

        subtotalElement.textContent = "Rp 0";
        totalElement.textContent = "Rp 0";

        return;

      }


      /* HAS ITEMS */

      emptyCart.style.display = "none";

      cartItems.classList.add("has-items");


      cartItems.innerHTML =
        cart.map((item, index) => {

          const itemTotal =
            item.price * item.quantity;


          return `
            <div class="cart-item">

              <div class="cart-item-image">

                ${
                  item.image
                  ?
                  `<img
                    src="${escapeHtml(item.image)}"
                    alt="${escapeHtml(item.name)}"
                  >`
                  :
                  `<span
                    style="
                      font-family:Georgia,serif;
                      font-size:11px;
                      text-align:center;
                      color:#777;
                    "
                  >
                    SNS<br>FRAGRANCE
                  </span>`
                }

              </div>


              <div class="cart-item-info">

                <button
                  class="remove-item"
                  type="button"
                  onclick="removeItem(${index})"
                  aria-label="Remove item">
                  ×
                </button>


                <div class="cart-item-category">
                  ${escapeHtml(item.category)}
                </div>


                <div class="cart-item-name">
                  ${escapeHtml(item.name)}
                </div>


                <div class="cart-item-price">
                  ${formatRupiah(itemTotal)}
                </div>


                <div class="quantity-control">

                  <button
                    type="button"
                    onclick="changeQuantity(${index}, -1)">
                    −
                  </button>

                  <span class="quantity-value">
                    ${item.quantity}
                  </span>

                  <button
                    type="button"
                    onclick="changeQuantity(${index}, 1)">
                    +
                  </button>

                </div>

              </div>

            </div>
          `;

        }).join("");


      const subtotal =
        cart.reduce(
          (sum, item) =>
            sum + (item.price * item.quantity),
          0
        );


      subtotalElement.textContent =
        formatRupiah(subtotal);

      totalElement.textContent =
        formatRupiah(subtotal);

    }


    /* =====================================================
       CHANGE QUANTITY
       ===================================================== */

    function changeQuantity(index, amount) {

      if (!cart[index]) return;


      cart[index].quantity += amount;


      if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

      }


      saveCart();

      renderCart();

    }


    /* =====================================================
       REMOVE ITEM
       ===================================================== */

    function removeItem(index) {

      cart.splice(index, 1);

      saveCart();

      renderCart();

    }


    /* =====================================================
       FORMAT PRICE
       ===================================================== */

    function formatRupiah(number) {

      return new Intl.NumberFormat(
        "id-ID",
        {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0
        }
      ).format(number);

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       CLOSE CART
       ===================================================== */

    function goBack() {

      if (window.history.length > 1) {

        window.history.back();

      } else {

        window.location.href = "index.html";

      }

    }


    /* =====================================================
       CHECKOUT
       ===================================================== */

    function checkout() {

      if (cart.length === 0) {

        alert("Your cart is empty.");

        return;

      }

      alert(
        "Checkout will be connected here."
      );

    }


    /* =====================================================
       START
       ===================================================== */

    loadCart();


    /* =====================================================
       KEEP CART UPDATED
       ===================================================== */

    window.addEventListener(
      "storage",
      function(event) {

        if (event.key === STORAGE_KEY) {

          loadCart();

        }

      }
    );

  </script>

</body>
</html>
