/* =====================================================
   RESET
===================================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --black: #111;
  --white: #fff;
  --gold: #8b6736;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: var(--black);
  background: var(--white);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}


main {
  flex: 1 0 auto;
  width: 100%;
  min-width: 0;
}



/* =====================================================
   ANNOUNCEMENT BAR
===================================================== */







@keyframes announcementScroll {

  0% {
    transform: translateX(0);
  }

  100% {
    transform: translateX(-50%);
  }

}

/* =====================================================
   PAGE TITLE — AMBIENT ESSENCE
===================================================== */

.page-title {
   width: 100%;
   padding: 25px 20px 20px;
   background: #fff;
   text-align: center;
}

.page-title h1 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.7px;
  line-height: 1.2;
  color: #111;
}

@media (max-width: 650px){
  .page-title {
    padding: 20px 15px 16px;
  }

  .page-title h1 {
    font-size: 21px;
  }
}

/* =====================================================
   SEARCH PANEL
===================================================== */
























/* =====================================================
   CART DRAWER
===================================================== */
















































/* =====================================================
   HERO
===================================================== */

.extrait-hero {
  width: 100%;
  height: auto;
  display: block;
  overflow: hidden;
  line-height: 0;
}

/* =====================================================
   HERO IMAGE
===================================================== */

.extrait-hero-image {
  width: 100%;
  height: auto;
  position: relative;
}

.extrait-hero-image img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  object-position: center;
}

/* SECOND BANNER IMAGE */
.second-banner {
  width: 100%;
  aspect-ratio: 2.8 / 1;
  overflow: hidden;
}

.second-banner img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

/* =====================================================
   HERO TEXT
===================================================== */

.hero-copy {
  position: absolute;

  z-index: 2;

  left: 12%;

  top: 50%;

  transform: translateY(-50%);

  color: #fff;
}

.hero-small {
  display: inline-block;

  padding: 7px 25px;

  background: rgba(255,255,255,.14);

  font-size: 13px;

  letter-spacing: 1px;

  margin-bottom: 18px;
}

.hero-copy h1 {
  font-size: 53px;

  font-weight: 400;

  letter-spacing: 5px;

  margin-bottom: 20px;
}

.hero-copy p {
  font-size: 16px;

  letter-spacing: 1px;
}


/* =====================================================
   HERO RIGHT SIDE
===================================================== */

.extrait-hero-title {
  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  background: #fff;
}

.extrait-hero-title h2 {
  font-size: 31px;

  font-weight: 600;

  letter-spacing: -.5px;
}


/* =====================================================
   FILTER BAR
===================================================== */

.filter-bar {
  height: 68px;

  display: flex;

  align-items: center;

  padding: 0 30px;

  border-bottom: 1px solid #fff;

  border-top: 1px solid #fff;
}

.filter-button {
  display: flex;

  align-items: center;

  gap: 10px;

  border: none;

  background: transparent;

  font-family: Arial, Helvetica, sans-serif;

  font-size: 14px;

  cursor: pointer;
}

.filter-button svg {
  width: 16px;
  height: 16px;

  fill: none;

  stroke: #111;

  stroke-width: 1.5;

  stroke-linecap: round;
  stroke-linejoin: round;
}


/* =====================================================
   FILTER PANEL
===================================================== */

.filter-panel {
  display: none;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 40px;

  padding: 30px;

  background: #fafafa;

  border-bottom: 1px solid #eee;
}

.filter-panel.active {
  display: grid;
}

.filter-group h4 {
  font-size: 12px;

  text-transform: uppercase;

  letter-spacing: 1px;

  margin-bottom: 15px;
}

.filter-group label {
  display: block;

  font-size: 13px;

  color: #555;

  margin-bottom: 10px;

  cursor: pointer;
}

.filter-group input {
  margin-right: 8px;
}


/* =====================================================
   PRODUCT GRID
===================================================== */

.product-grid {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  border-left: 1px solid #fff;
}


/* =====================================================
   PRODUCT CARD
===================================================== */

.product-card {
  border-right: 1px solid #fff;

  border-bottom: 1px solid #fff;

  background: #fff;

  min-width: 0;
}

/* =====================================================
   PRODUCT IMAGE — SQUARE FRAME
===================================================== */
.product-image {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  transition: transform .45s ease;
}
      
.product-card:hover
.product-image img {
  transform: scale(1.04);
}

/* =====================================================
   BADGES
===================================================== */

.badge {
  position: absolute;

  top: 10px;

  z-index: 5;

  padding: 7px 15px;

  border-radius: 20px;

  font-size: 11px;

  letter-spacing: .5px;
}

.new-arrival {
  left: 0;

  background: #eeeeee;
}

.best-seller {
  left: 0;

  background: #eeeeee;
}

.sale {
  right: 52px;

  background: #efd8c7;
}


/* =====================================================
   PRODUCT WISHLIST
===================================================== */

.product-wishlist {
  position: absolute;

  top: 8px;
  right: 10px;

  z-index: 10;

  width: 38px;
  height: 38px;

  border: none;

  border-radius: 50%;

  background: #fff;

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  box-shadow:
    0 3px 12px rgba(0,0,0,.06);
}

.product-wishlist svg {
  width: 20px;
  height: 20px;

  fill: none;

  stroke: #111;

  stroke-width: 1.7;

  stroke-linecap: round;
  stroke-linejoin: round;
}

.product-wishlist.selected {
  background: #fff0f3;
}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info {
  padding:
    17px
    15px
    12px;

  text-align: center;
}

.product-name {
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.3px;

  margin-bottom: 5px;
}

.product-price {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  font-size: 12px;
}

.current-price {
  font-weight: 600;
}

.old-price {
  color: #777;

  text-decoration: line-through;

  font-size: 11px;
}

/* =====================================================
   REVIEWS
===================================================== */

.reviews {
  padding: 45px 40px;

  border-top: 1px solid #eee;

  border-bottom: 1px solid #eee;

  font-size: 16px;

  font-weight: 600;
}


/* =====================================================
   FLOATING BUTTONS
===================================================== */

.floating {
  position: fixed;

  z-index: 1000;

  text-decoration: none;

  box-sizing: border-box;
}


/* =====================================================
   REVIEWS BUTTON
===================================================== */

.floating.review-button {
  left: 18px;

  bottom: 80px;

  height: 52px;

  padding: 0 20px;

  background: #fff;

  color: #111;

  border-radius: 40px;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 16px;

  font-weight: 600;

  line-height: 1;

  box-shadow:
    0 6px 25px rgba(0,0,0,0.12);

  cursor: pointer;
}

.floating.review-button:hover {
  color: #111;

  text-decoration: none;

  transform: translateY(-1px);
}

.floating.review-button svg {
  width: 18px;
  height: 18px;

  flex: 0 0 18px;

  display: block;

  fill: #111;
}


/* =====================================================
   JOIN MEMBER
===================================================== */

.floating.join.member {
  left: 18px;

  bottom: 18px;

  background: #000;

  color: #fff;

  padding: 15px 24px;

  border-radius: 40px;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 16px;

  font-weight: 600;

  line-height: 1;

  box-shadow:
    0 6px 25px rgba(0,0,0,0.20);

  cursor: pointer;
}

.floating.join.member:hover {
  color: #fff;

  text-decoration: none;

  transform: translateY(-1px);
}

/* SNS GLOBAL FOOTER CONTAINER */
#sns-footer-container {
    display: block;
    width: 100%;
    clear: both;
    margin: 0;
    padding: 0;
    position: relative;
    margin-top: auto;
    flex-shrink: 0;
}
